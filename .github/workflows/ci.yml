name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  # Registre de conteneurs cible. Pour basculer vers Docker Hub plus tard,
  # il suffit de changer REGISTRY/IMAGE_NAME et le login utilise dans le
  # job "push" (secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN par exemple).
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build backend et frontend
        run: npm run build

  test:
    name: Lint et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  security:
    name: Audit des dependances (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Informatif pour l'instant (continue-on-error) : certaines
      # vulnerabilites connues touchent uniquement des devDependencies
      # (eslint, vite, node-pg-migrate) non exploitables via notre usage et
      # non presentes dans l'image de production. A rendre bloquant une
      # fois ces dependances mises a jour vers des versions sans breaking
      # change.
      - name: npm audit (severite haute et critique)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sans push) pour valider le Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: openbackup:ci

  push:
    name: Publier l'image sur le registre
    runs-on: ubuntu-latest
    needs: [docker]
    # Ne publie que sur main ou sur un tag de release, jamais sur une PR.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion au registre
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadonnees de l'image (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
