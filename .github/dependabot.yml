version: 2
updates:
  # Root workspace (dev tooling: concurrently, etc.)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'

  # Backend dependencies
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'

  # Frontend dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'

  # Base images used by the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Actions used by the CI workflow
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
